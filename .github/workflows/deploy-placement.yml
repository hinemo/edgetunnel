name: Deploy Worker Placement

on:
  workflow_dispatch:
    inputs:
      placement:
        description: Worker execution placement
        required: true
        default: singapore
        type: choice
        options:
          - auto
          - tokyo
          - singapore
          - seoul
          - hongkong
          - mumbai
          - sydney
          - frankfurt
          - london
          - oregon
          - virginia

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.placement }} placement
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v6

      - name: Resolve approved placement region
        id: placement
        shell: bash
        run: |
          case "${{ inputs.placement }}" in
            auto) echo "region=" >> "$GITHUB_OUTPUT" ;;
            tokyo) echo "region=aws:ap-northeast-1" >> "$GITHUB_OUTPUT" ;;
            singapore) echo "region=aws:ap-southeast-1" >> "$GITHUB_OUTPUT" ;;
            seoul) echo "region=aws:ap-northeast-2" >> "$GITHUB_OUTPUT" ;;
            hongkong) echo "region=aws:ap-east-1" >> "$GITHUB_OUTPUT" ;;
            mumbai) echo "region=aws:ap-south-1" >> "$GITHUB_OUTPUT" ;;
            sydney) echo "region=aws:ap-southeast-2" >> "$GITHUB_OUTPUT" ;;
            frankfurt) echo "region=aws:eu-central-1" >> "$GITHUB_OUTPUT" ;;
            london) echo "region=aws:eu-west-2" >> "$GITHUB_OUTPUT" ;;
            oregon) echo "region=aws:us-west-2" >> "$GITHUB_OUTPUT" ;;
            virginia) echo "region=aws:us-east-1" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported placement" >&2; exit 64 ;;
          esac

      - name: Render deployment-only Wrangler configuration
        env:
          PLACEMENT_REGION: ${{ steps.placement.outputs.region }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          region = os.environ["PLACEMENT_REGION"]
          if region:
              text, changed = re.subn(
                  r"(?m)^\[placement\]\n(?:region\s*=\s*\"[^\"]+\"\n)?",
                  f'[placement]\nregion = "{region}"\n',
                  text,
                  count=1,
              )
              if changed != 1:
                  raise SystemExit("[placement] block was not found")
          else:
              text = re.sub(r"(?m)^\[placement\]\n(?:region\s*=\s*\"[^\"]+\"\n)?", "", text, count=1)
          path.write_text(text)
          PY
          grep -A1 '^\[placement\]' wrangler.toml || true

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy --config wrangler.toml